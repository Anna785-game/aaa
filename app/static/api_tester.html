<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Route Tracker — API Tester</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161923;
    --panel-2: #1c2029;
    --border: #262b38;
    --text: #e6e8ee;
    --text-dim: #8b91a3;
    --accent: #4f8dfd;
    --accent-dim: #2c4d8a;
    --ok: #3ecf8e;
    --warn: #f5a623;
    --err: #ef4a5f;
    --mono: 'SF Mono', 'JetBrains Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-columns: 260px 1fr 1fr;
    height: 100vh;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0;
  }
  .brand {
    padding: 0 16px 16px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .brand h1 {
    font-size: 15px;
    margin: 0 0 2px 0;
    letter-spacing: -0.2px;
  }
  .brand .sub {
    font-size: 11px;
    color: var(--text-dim);
  }
  .config {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .config label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin-bottom: 4px;
    margin-top: 10px;
  }
  .config label:first-child { margin-top: 0; }
  .config input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 5px;
    font-size: 12px;
    font-family: var(--mono);
  }
  .config .token-status {
    font-size: 10px;
    margin-top: 4px;
    color: var(--text-dim);
  }
  .token-status.set { color: var(--ok); }

  .group-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--text-dim);
    padding: 10px 16px 6px 16px;
  }
  .endpoint {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text-dim);
    border-left: 2px solid transparent;
  }
  .endpoint:hover { background: var(--panel-2); color: var(--text); }
  .endpoint.active {
    background: var(--panel-2);
    color: var(--text);
    border-left: 2px solid var(--accent);
  }
  .method-tag {
    font-family: var(--mono);
    font-size: 9.5px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
    min-width: 40px;
    text-align: center;
  }
  .m-GET { background: #1c3a2e; color: var(--ok); }
  .m-POST { background: #1f3352; color: var(--accent); }
  .m-DELETE { background: #3a1c22; color: var(--err); }

  /* ===== REQUEST PANEL ===== */
  .request-panel {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 24px;
  }
  .req-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .req-path {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--text);
  }
  .req-desc {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .field-group { margin-bottom: 14px; }
  .field-group label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 5px;
    font-family: var(--mono);
  }
  .field-group .hint {
    font-weight: 400;
    color: #5a6072;
    text-transform: none;
    letter-spacing: 0;
    margin-left: 6px;
  }
  .field-group input, .field-group select, .field-group textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-family: var(--mono);
  }
  .field-group textarea {
    min-height: 140px;
    resize: vertical;
  }
  .field-group input:focus, .field-group textarea:focus, .field-group select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .checkbox-row input { width: auto; }

  .points-editor {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    background: var(--panel-2);
  }
  .point-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 6px;
    margin-bottom: 6px;
  }
  .point-row input {
    font-size: 12px;
    padding: 6px 8px;
  }
  .point-row button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--err);
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    padding: 0 8px;
  }
  .btn-small {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 5px;
    cursor: pointer;
    font-size: 11px;
    padding: 5px 10px;
    margin-top: 4px;
  }
  .btn-small:hover { color: var(--text); border-color: var(--accent); }

  .send-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 11px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }
  .send-btn:hover { background: #3f7ce0; }
  .send-btn:disabled { background: var(--accent-dim); cursor: wait; }

  .auth-badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .auth-badge.required { color: var(--warn); border-color: #4a3a1c; }

  /* ===== RESPONSE PANEL ===== */
  .response-panel {
    overflow-y: auto;
    padding: 20px 24px;
    background: #0d0f14;
  }
  .response-panel h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin: 0 0 12px 0;
  }
  .status-line {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    font-family: var(--mono);
  }
  .status-code {
    font-size: 20px;
    font-weight: 700;
  }
  .status-code.ok { color: var(--ok); }
  .status-code.err { color: var(--err); }
  .status-time { font-size: 11px; color: var(--text-dim); }
  pre.resp-body {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .empty-state {
    color: #4a4f5e;
    font-size: 12.5px;
    text-align: center;
    margin-top: 60px;
    line-height: 1.6;
  }
  .history {
    margin-top: 20px;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 11.5px;
    font-family: var(--mono);
    cursor: pointer;
    color: var(--text-dim);
  }
  .history-item:hover { color: var(--text); }
  .history-item .h-code.ok { color: var(--ok); }
  .history-item .h-code.err { color: var(--err); }

  .json-key { color: #7dbcff; }
  .json-str { color: #a5e6a5; }
  .json-num { color: #f5a623; }
  .json-bool { color: #d38cf2; }
  .json-null { color: #5a6072; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a2f3c; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="brand">
      <h1>Safe Route Tracker</h1>
      <div class="sub">API Tester</div>
    </div>

    <div class="config">
      <label>Base URL</label>
      <input id="baseUrl" type="text" value="http://127.0.0.1:8000" spellcheck="false">
      <label>Access token (Bearer)</label>
      <input id="tokenInput" type="text" placeholder="collé automatiquement après login" spellcheck="false">
      <div id="tokenStatus" class="token-status">Aucun token défini</div>
    </div>

    <div id="nav"></div>
  </div>

  <!-- REQUEST PANEL -->
  <div class="request-panel" id="requestPanel"></div>

  <!-- RESPONSE PANEL -->
  <div class="response-panel">
    <h2>Réponse</h2>
    <div id="responseArea">
      <div class="empty-state">Sélectionnez un endpoint à gauche,<br>remplissez les champs, puis cliquez sur « Envoyer ».</div>
    </div>
    <div class="history" id="historyArea"></div>
  </div>

</div>

<script>
// =========================================================
// ENDPOINT DEFINITIONS
// =========================================================
const ENDPOINTS = [
  { group: "Authentification", items: [
    { id: "register", method: "POST", path: "/auth/register", auth: false,
      desc: "Créer un compte utilisateur (Supabase Auth).",
      fields: [
        { name: "email", type: "text", placeholder: "user@example.com" },
        { name: "password", type: "text", placeholder: "motdepasse" }
      ],
      build: f => ({ email: f.email, password: f.password }),
      afterSuccess: null
    },
    { id: "login", method: "POST", path: "/auth/login", auth: false,
      desc: "Se connecter et récupérer un access_token / refresh_token.",
      fields: [
        { name: "email", type: "text", placeholder: "user@example.com" },
        { name: "password", type: "text", placeholder: "motdepasse" }
      ],
      build: f => ({ email: f.email, password: f.password }),
      afterSuccess: (data) => {
        if (data && data.access_token) {
          document.getElementById("tokenInput").value = data.access_token;
          saveConfig();
          updateTokenStatus();
        }
      }
    }
  ]},

  { group: "Profil", items: [
    { id: "profile-create", method: "POST", path: "/profile/create", auth: true,
      desc: "Créer le profil du user courant (nom, téléphone, âge).",
      fields: [
        { name: "full_name", type: "text", placeholder: "Jean Dupont" },
        { name: "phone_number", type: "text", placeholder: "+33612345678" },
        { name: "age", type: "number", placeholder: "25" }
      ],
      build: f => ({ full_name: f.full_name, phone_number: f.phone_number, age: parseInt(f.age, 10) })
    },
    { id: "profile-me", method: "GET", path: "/profile/me", auth: true,
      desc: "Récupérer le profil du user courant.",
      fields: [], build: () => null
    }
  ]},

  { group: "Contacts d'urgence", items: [
    { id: "contact-add", method: "POST", path: "/emergency-contacts/add", auth: true,
      desc: "Ajouter directement un contact d'urgence (nom, téléphone, rôle). Aucune confirmation nécessaire — le contact peut ne pas avoir l'app.",
      fields: [
        { name: "full_name", type: "text", placeholder: "Marie Dupont" },
        { name: "phone_number", type: "text", placeholder: "+33698765432" },
        { name: "relationship", type: "select", options: ["mother","father","brother","sister","guardian","uncle","aunt","grandmother","grandfather"] }
      ],
      build: f => ({ full_name: f.full_name, phone_number: f.phone_number, relationship: f.relationship })
    },
    { id: "contact-mine", method: "GET", path: "/emergency-contacts/my-contacts", auth: true,
      desc: "Lister mes contacts d'urgence.",
      fields: [], build: () => null
    },
    { id: "contact-delete", method: "DELETE", path: "/emergency-contacts/{contact_id}", auth: true,
      desc: "Supprimer un contact d'urgence.",
      pathParams: [{ name: "contact_id", placeholder: "uuid du contact" }],
      fields: [], build: () => null
    }
  ]},

  { group: "Notifications", items: [
    { id: "device-register", method: "POST", path: "/notifications/register-device", auth: true,
      desc: "Enregistrer / mettre à jour un token d'appareil pour le push.",
      fields: [
        { name: "token", type: "text", placeholder: "fcm-device-token" },
        { name: "platform", type: "select", options: ["android","ios","web"] }
      ],
      build: f => ({ token: f.token, platform: f.platform })
    },
    { id: "device-list", method: "GET", path: "/notifications/my-devices", auth: true,
      desc: "Lister mes appareils enregistrés.",
      fields: [], build: () => null
    },
    { id: "device-delete", method: "DELETE", path: "/notifications/delete-device/{token}", auth: true,
      desc: "Supprimer un appareil enregistré.",
      pathParams: [{ name: "token", placeholder: "fcm-device-token" }],
      fields: [], build: () => null
    }
  ]},

  { group: "Routes", items: [
    { id: "route-create", method: "POST", path: "/routes/create", auth: true,
      desc: "Créer une route avec une liste de points GPS (ordre = trajet).",
      fields: [
        { name: "route_name", type: "text", placeholder: "Trajet maison-école" },
        { name: "is_sensitive", type: "checkbox", label: "Route sensible (protection anti-vol)" },
        { name: "points", type: "points" }
      ],
      build: f => ({
        route_name: f.route_name,
        is_sensitive: !!f.is_sensitive,
        points: (f.points || []).map(p => ({
          latitude: parseFloat(p.latitude),
          longitude: parseFloat(p.longitude),
          timestamp: p.timestamp || null
        }))
      })
    },
    { id: "route-list", method: "GET", path: "/routes/list", auth: true,
      desc: "Lister mes routes.",
      fields: [], build: () => null
    },
    { id: "route-get", method: "GET", path: "/routes/{route_id}", auth: true,
      desc: "Détails d'une route.",
      pathParams: [{ name: "route_id", placeholder: "uuid de la route" }],
      fields: [], build: () => null
    }
  ]},

  { group: "Tracking", items: [
    { id: "track-start", method: "POST", path: "/tracking/start/{route_id}", auth: true,
      desc: "Démarrer une session de tracking. Nécessite la position actuelle en headers + un device-id.",
      pathParams: [{ name: "route_id", placeholder: "uuid de la route" }],
      headerParams: [
        { name: "x-current-lat", placeholder: "48.8566" },
        { name: "x-current-lng", placeholder: "2.3522" },
        { name: "device-id", placeholder: "device-abc-123 (min 8 caractères)" }
      ],
      fields: [], build: () => null
    },
    { id: "track-segment", method: "POST", path: "/tracking/segment/{session_id}", auth: true,
      desc: "Envoyer un segment de points GPS pour une session active.",
      pathParams: [{ name: "session_id", placeholder: "uuid de la session" }],
      fields: [
        { name: "points", type: "points" }
      ],
      build: f => ({
        points: (f.points || []).map(p => ({
          latitude: parseFloat(p.latitude),
          longitude: parseFloat(p.longitude),
          timestamp: p.timestamp || null
        }))
      })
    },
    { id: "track-resume", method: "POST", path: "/tracking/resume/{session_id}", auth: true,
      desc: "Reprendre une session après une interruption (envoie la position actuelle).",
      pathParams: [{ name: "session_id", placeholder: "uuid de la session" }],
      fields: [
        { name: "latitude", type: "number", placeholder: "48.8566", step: "any" },
        { name: "longitude", type: "number", placeholder: "2.3522", step: "any" }
      ],
      build: f => ({ latitude: parseFloat(f.latitude), longitude: parseFloat(f.longitude) })
    },
    { id: "track-complete", method: "POST", path: "/tracking/complete/{session_id}", auth: true,
      desc: "Terminer une session de tracking.",
      pathParams: [{ name: "session_id", placeholder: "uuid de la session" }],
      fields: [], build: () => null
    }
  ]}
];

let currentEndpoint = null;
let historyLog = [];

// =========================================================
// CONFIG PERSISTENCE (localStorage — outil local, pas un artifact Claude)
// =========================================================
function saveConfig() {
  localStorage.setItem("srt_base_url", document.getElementById("baseUrl").value);
  localStorage.setItem("srt_token", document.getElementById("tokenInput").value);
}
function loadConfig() {
  const url = localStorage.getItem("srt_base_url");
  const token = localStorage.getItem("srt_token");
  if (url) document.getElementById("baseUrl").value = url;
  if (token) document.getElementById("tokenInput").value = token;
}
function updateTokenStatus() {
  const el = document.getElementById("tokenStatus");
  const val = document.getElementById("tokenInput").value.trim();
  if (val) {
    el.textContent = "Token défini (" + val.slice(0, 14) + "…)";
    el.classList.add("set");
  } else {
    el.textContent = "Aucun token défini";
    el.classList.remove("set");
  }
}
document.getElementById("baseUrl").addEventListener("input", saveConfig);
document.getElementById("tokenInput").addEventListener("input", () => { saveConfig(); updateTokenStatus(); });

// =========================================================
// NAV RENDER
// =========================================================
function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  ENDPOINTS.forEach(group => {
    const title = document.createElement("div");
    title.className = "group-title";
    title.textContent = group.group;
    nav.appendChild(title);

    group.items.forEach(ep => {
      const row = document.createElement("div");
      row.className = "endpoint";
      row.dataset.id = ep.id;
      row.innerHTML = `<span class="method-tag m-${ep.method}">${ep.method}</span><span>${ep.path}</span>`;
      row.addEventListener("click", () => selectEndpoint(ep.id));
      nav.appendChild(row);
    });
  });
}

function findEndpoint(id) {
  for (const group of ENDPOINTS) {
    const found = group.items.find(e => e.id === id);
    if (found) return found;
  }
  return null;
}

// =========================================================
// REQUEST PANEL RENDER
// =========================================================
function selectEndpoint(id) {
  currentEndpoint = findEndpoint(id);
  document.querySelectorAll(".endpoint").forEach(el => {
    el.classList.toggle("active", el.dataset.id === id);
  });
  renderRequestPanel();
}

function renderRequestPanel() {
  const ep = currentEndpoint;
  const panel = document.getElementById("requestPanel");
  if (!ep) { panel.innerHTML = ""; return; }

  let html = `
    <div class="req-header">
      <span class="method-tag m-${ep.method}">${ep.method}</span>
      <span class="req-path">${ep.path}</span>
      <span class="auth-badge ${ep.auth ? 'required' : ''}">${ep.auth ? '🔒 auth requise' : 'public'}</span>
    </div>
    <div class="req-desc">${ep.desc}</div>
  `;

  if (ep.pathParams) {
    ep.pathParams.forEach(p => {
      html += `
        <div class="field-group">
          <label>path · ${p.name}</label>
          <input type="text" data-pathparam="${p.name}" placeholder="${p.placeholder || ''}">
        </div>`;
    });
  }

  if (ep.headerParams) {
    ep.headerParams.forEach(h => {
      html += `
        <div class="field-group">
          <label>header · ${h.name}</label>
          <input type="text" data-headerparam="${h.name}" placeholder="${h.placeholder || ''}">
        </div>`;
    });
  }

  (ep.fields || []).forEach(f => {
    if (f.type === "select") {
      html += `
        <div class="field-group">
          <label>${f.name}</label>
          <select data-field="${f.name}">
            ${f.options.map(o => `<option value="${o}">${o}</option>`).join("")}
          </select>
        </div>`;
    } else if (f.type === "checkbox") {
      html += `
        <div class="field-group checkbox-row">
          <input type="checkbox" data-field="${f.name}" id="chk-${f.name}">
          <label for="chk-${f.name}" style="margin:0;">${f.label}</label>
        </div>`;
    } else if (f.type === "points") {
      html += `
        <div class="field-group">
          <label>points <span class="hint">(latitude, longitude, timestamp ISO optionnel)</span></label>
          <div class="points-editor" id="points-editor"></div>
          <button type="button" class="btn-small" id="addPointBtn">+ ajouter un point</button>
        </div>`;
    } else {
      html += `
        <div class="field-group">
          <label>${f.name}</label>
          <input type="${f.type}" ${f.step ? `step="${f.step}"` : ''} data-field="${f.name}" placeholder="${f.placeholder || ''}">
        </div>`;
    }
  });

  html += `<button class="send-btn" id="sendBtn">Envoyer ${ep.method} ${ep.path}</button>`;

  panel.innerHTML = html;

  if ((ep.fields || []).some(f => f.type === "points")) {
    setupPointsEditor();
  }

  document.getElementById("sendBtn").addEventListener("click", sendRequest);
}

function setupPointsEditor() {
  const editor = document.getElementById("points-editor");
  const addBtn = document.getElementById("addPointBtn");

  function addRow(lat = "", lng = "", ts = "") {
    const row = document.createElement("div");
    row.className = "point-row";
    row.innerHTML = `
      <input type="text" placeholder="lat" class="p-lat" value="${lat}">
      <input type="text" placeholder="lng" class="p-lng" value="${lng}">
      <input type="text" placeholder="timestamp ISO (optionnel)" class="p-ts" value="${ts}">
      <button type="button" title="Supprimer">✕</button>
    `;
    row.querySelector("button").addEventListener("click", () => row.remove());
    editor.appendChild(row);
  }

  addBtn.addEventListener("click", () => addRow());
  // Start with two example rows
  addRow("48.8566", "2.3522", new Date(Date.now() - 60000).toISOString());
  addRow("48.8570", "2.3530", new Date().toISOString());
}

function collectPoints() {
  const editor = document.getElementById("points-editor");
  if (!editor) return [];
  const rows = editor.querySelectorAll(".point-row");
  const points = [];
  rows.forEach(row => {
    const lat = row.querySelector(".p-lat").value.trim();
    const lng = row.querySelector(".p-lng").value.trim();
    const ts = row.querySelector(".p-ts").value.trim();
    if (lat !== "" && lng !== "") {
      points.push({ latitude: lat, longitude: lng, timestamp: ts || null });
    }
  });
  return points;
}

// =========================================================
// SEND REQUEST
// =========================================================
async function sendRequest() {
  const ep = currentEndpoint;
  const btn = document.getElementById("sendBtn");
  const baseUrl = document.getElementById("baseUrl").value.replace(/\/+$/, "");
  const token = document.getElementById("tokenInput").value.trim();

  // Build path with params
  let path = ep.path;
  if (ep.pathParams) {
    ep.pathParams.forEach(p => {
      const input = document.querySelector(`[data-pathparam="${p.name}"]`);
      const val = input ? input.value.trim() : "";
      path = path.replace(`{${p.name}}`, encodeURIComponent(val));
    });
  }

  // Collect field values
  const fieldValues = {};
  (ep.fields || []).forEach(f => {
    if (f.type === "points") {
      fieldValues.points = collectPoints();
    } else if (f.type === "checkbox") {
      const el = document.querySelector(`[data-field="${f.name}"]`);
      fieldValues[f.name] = el ? el.checked : false;
    } else {
      const el = document.querySelector(`[data-field="${f.name}"]`);
      fieldValues[f.name] = el ? el.value : "";
    }
  });

  const body = ep.build ? ep.build(fieldValues) : null;

  // Headers
  const headers = { "Content-Type": "application/json" };
  if (ep.auth && token) headers["Authorization"] = "Bearer " + token;
  if (ep.headerParams) {
    ep.headerParams.forEach(h => {
      const input = document.querySelector(`[data-headerparam="${h.name}"]`);
      const val = input ? input.value.trim() : "";
      if (val) headers[h.name] = val;
    });
  }

  btn.disabled = true;
  btn.textContent = "Envoi en cours…";

  const start = performance.now();
  try {
    const res = await fetch(baseUrl + path, {
      method: ep.method,
      headers,
      body: (ep.method !== "GET" && body !== null) ? JSON.stringify(body) : undefined
    });

    const elapsed = Math.round(performance.now() - start);
    let data;
    const text = await res.text();
    try { data = JSON.parse(text); } catch { data = text; }

    renderResponse(res.status, res.ok, data, elapsed, ep);

    if (ep.afterSuccess && res.ok) ep.afterSuccess(data);

  } catch (err) {
    const elapsed = Math.round(performance.now() - start);
    renderResponse(0, false, { error: "Requête échouée", detail: String(err) }, elapsed, ep);
  } finally {
    btn.disabled = false;
    btn.textContent = `Envoyer ${ep.method} ${ep.path}`;
  }
}

// =========================================================
// RESPONSE RENDER
// =========================================================
function syntaxHighlight(json) {
  const str = typeof json === "string" ? json : JSON.stringify(json, null, 2);
  return str
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|null|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g,
      match => {
        let cls = "json-num";
        if (/^"/.test(match)) {
          cls = /:$/.test(match) ? "json-key" : "json-str";
        } else if (/true|false/.test(match)) {
          cls = "json-bool";
        } else if (/null/.test(match)) {
          cls = "json-null";
        }
        return `<span class="${cls}">${match}</span>`;
      });
}

function renderResponse(status, ok, data, elapsed, ep) {
  const area = document.getElementById("responseArea");
  const statusClass = status >= 200 && status < 300 ? "ok" : "err";

  area.innerHTML = `
    <div class="status-line">
      <span class="status-code ${statusClass}">${status || "ERR"}</span>
      <span class="status-time">${elapsed} ms · ${ep.method} ${ep.path}</span>
    </div>
    <pre class="resp-body">${syntaxHighlight(data)}</pre>
  `;

  historyLog.unshift({ ep, status, ok, elapsed, time: new Date().toLocaleTimeString(), data });
  historyLog = historyLog.slice(0, 25);
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById("historyArea");
  if (!historyLog.length) { el.innerHTML = ""; return; }

  let html = `<h2 style="margin-top:24px;">Historique</h2>`;
  historyLog.forEach((h, i) => {
    const cls = h.status >= 200 && h.status < 300 ? "ok" : "err";
    html += `
      <div class="history-item" data-hist="${i}">
        <span>${h.time} · ${h.ep.method} ${h.ep.path}</span>
        <span class="h-code ${cls}">${h.status || "ERR"} · ${h.elapsed}ms</span>
      </div>`;
  });
  el.innerHTML = html;

  el.querySelectorAll("[data-hist]").forEach(node => {
    node.addEventListener("click", () => {
      const h = historyLog[parseInt(node.dataset.hist, 10)];
      renderResponse(h.status, h.ok, h.data, h.elapsed, h.ep);
    });
  });
}
